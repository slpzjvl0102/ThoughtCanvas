# 새 버전 배포: ThoughtCanvas.csproj의 <Version>을 올려 main에 merge한 뒤,
# GitHub → Actions → Release → Run workflow를 누르면 됩니다.
# Build → 자동 검증(self-test) → publish → Velopack 패키지(Setup.exe, 업데이트용 nupkg) → GitHub Release v<Version> 생성까지 자동으로 합니다.
# 설치된 ThoughtCanvas는 이 Release를 보고 스스로 업데이트합니다.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content ThoughtCanvas.csproj
          $v = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if (-not $v) { throw "ThoughtCanvas.csproj에 <Version>이 없습니다." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "배포 버전: v$v" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish
        run: dotnet publish ThoughtCanvas.csproj -c Release -r win-x64 --self-contained -o publish -nologo

      # build.yml과 같은 자동 검증 — 실패하면 배포하지 않습니다
      - name: Self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $p = Start-Process -FilePath publish/ThoughtCanvas.exe -ArgumentList '--self-test', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report -Raw -Encoding utf8 | Write-Output } else { throw "self-test report was not written (exit code $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # 이전 Release를 받아 두면 바뀐 부분만 담은 delta 패키지가 만들어집니다 (첫 배포 때는 없어도 됨)
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      # packId는 ThoughtCanvasApp — 설치 폴더 %LOCALAPPDATA%\ThoughtCanvasApp가 데이터 폴더 %LOCALAPPDATA%\ThoughtCanvas와 겹치지 않게 합니다
      - name: Pack
        run: vpk pack -u ThoughtCanvasApp -v ${{ steps.ver.outputs.version }} -r win-x64 -p publish -e ThoughtCanvas.exe --packTitle ThoughtCanvas -o releases

      # 이전 실행이 업로드 도중 실패하면 같은 tag의 draft Release가 남아 다음 업로드를 막습니다.
      # 게시되지 않은 draft만 지우고 다시 올립니다 (게시된 Release는 건드리지 않음).
      - name: Remove leftover draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $drafts = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.draft -and $_.tag_name -eq $tag }
          foreach ($d in $drafts) { Write-Output "draft Release $tag ($($d.id)) 삭제"; gh api -X DELETE "repos/${{ github.repository }}/releases/$($d.id)" }

      - name: Upload GitHub Release
        run: vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases --publish --releaseName "ThoughtCanvas ${{ steps.ver.outputs.version }}" --tag v${{ steps.ver.outputs.version }}
